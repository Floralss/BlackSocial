<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackSocial</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">⬤ <span>BlackSocial</span></div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Пароль" required>
      <button type="submit" class="btn-primary">Войти</button>
      <div class="auth-error" id="loginError"></div>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="regName" placeholder="Имя" required>
      <input type="text" id="regUsername" placeholder="Юзернейм (латиница, без @)" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" required>
      <button type="submit" class="btn-primary">Создать аккаунт</button>
      <div class="auth-error" id="registerError"></div>
    </form>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" class="app hidden">

  <!-- Icon rail -->
  <div class="rail">
    <div class="rail-icon active" data-view="chats" title="Все чаты">💬</div>
    <div class="rail-icon" data-view="new" title="Новый чат">✚</div>
    <div class="rail-spacer"></div>
    <div class="rail-avatar" id="myAvatar" title="Профиль"></div>
  </div>

  <!-- Chat list -->
  <div class="list-panel">
    <div class="list-header">
      <input type="text" id="searchInput" placeholder="Поиск">
    </div>
    <div id="chatList" class="chat-list"></div>
  </div>

  <!-- Chat area -->
  <div class="chat-panel" id="chatPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-emoji">⬤</div>
      <p>Выберите чат, чтобы начать общение</p>
    </div>

    <div class="chat-view hidden" id="chatView">
      <div class="chat-header">
        <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatHeaderName"></div>
          <div class="chat-header-sub" id="chatHeaderSub"></div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer" id="composer">
        <input type="text" id="msgInput" placeholder="Написать сообщение...">
        <button id="sendBtn" class="btn-send">➤</button>
      </div>
      <div class="composer-locked hidden" id="composerLocked">
        Только администраторы канала могут отправлять сообщения
      </div>
    </div>
  </div>
</div>

<!-- ===== NEW CHAT MODAL ===== -->
<div id="newChatModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span>Новый чат</span>
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-mtab="private">Личный</button>
      <button class="modal-tab" data-mtab="group">Группа</button>
      <button class="modal-tab" data-mtab="channel">Канал</button>
    </div>

    <!-- Private -->
    <div class="modal-pane" id="pane-private">
      <input type="text" id="userSearch" placeholder="Введите юзернейм...">
      <div id="userSearchResults" class="search-results"></div>
    </div>

    <!-- Group -->
    <div class="modal-pane hidden" id="pane-group">
      <input type="text" id="groupName" placeholder="Название группы">
      <input type="text" id="groupUserSearch" placeholder="Добавить участника по юзернейму...">
      <div id="groupSearchResults" class="search-results"></div>
      <div id="groupSelected" class="selected-chips"></div>
      <button class="btn-primary" id="createGroupBtn">Создать группу</button>
    </div>

    <!-- Channel -->
    <div class="modal-pane hidden" id="pane-channel">
      <input type="text" id="channelName" placeholder="Название канала">
      <textarea id="channelDesc" placeholder="Описание (необязательно)"></textarea>
      <button class="btn-primary" id="createChannelBtn">Создать канал</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
