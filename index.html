<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BlackSocial</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬤</text></svg>">
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-mark">⬤</div>
      <div class="logo-text">BlackSocial</div>
      <div class="logo-sub">мессенджер нового поколения</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>
    <form id="loginForm" class="auth-form">
      <div class="field">
        <input type="email" id="loginEmail" placeholder=" " required autocomplete="email">
        <label>Email</label>
      </div>
      <div class="field">
        <input type="password" id="loginPassword" placeholder=" " required autocomplete="current-password">
        <label>Пароль</label>
      </div>
      <button type="submit" class="btn-primary">Войти</button>
      <div class="auth-error" id="loginError"></div>
      <div class="auth-hint" id="loginHint">Нет аккаунта? Нажми «Регистрация» сверху</div>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <div class="field">
        <input type="text" id="regName" placeholder=" " required autocomplete="name">
        <label>Имя</label>
      </div>
      <div class="field">
        <input type="text" id="regUsername" placeholder=" " required autocomplete="username">
        <label>Юзернейм (латиница)</label>
      </div>
      <div class="field">
        <input type="email" id="regEmail" placeholder=" " required autocomplete="email">
        <label>Email</label>
      </div>
      <div class="field">
        <input type="password" id="regPassword" placeholder=" " required minlength="6" autocomplete="new-password">
        <label>Пароль (мин. 6)</label>
      </div>
      <button type="submit" class="btn-primary">Создать аккаунт</button>
      <div class="auth-error" id="registerError"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <section class="list-panel" id="listPanel">
    <header class="list-header">
      <button class="menu-btn" id="menuBtn" title="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск" autocomplete="off">
      </div>
    </header>
    <div id="chatList" class="chat-list"></div>

    <!-- Profile edit screen (inside list) -->
    <div id="profileScreen" class="profile-screen hidden">
      <div class="profile-header">
        <button class="back-btn" id="closeProfile" style="display:flex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2>Мой профиль</h2>
      </div>
      <div class="profile-body">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar-big" id="profileAvatarBig"></div>
          <button type="button" class="btn-change-avatar" id="changeAvatarBtn">Сменить аватар</button>
          <input type="file" id="avatarInput" accept="image/*" class="hidden">
        </div>
        <div class="profile-field">
          <label>Имя</label>
          <input type="text" id="editName" maxlength="40" autocomplete="name">
        </div>
        <div class="profile-field">
          <label>Юзернейм</label>
          <input type="text" id="editUsername" maxlength="24" autocomplete="username">
        </div>
        <div class="profile-field">
          <label>Email</label>
          <input type="text" id="editEmail" disabled>
        </div>
        <div class="profile-actions">
          <button class="btn-primary" id="saveProfileBtn">Сохранить</button>
          <button class="btn-danger" id="logoutBtn">Выйти из аккаунта</button>
        </div>
      </div>
    </div>
  </section>

  <main class="chat-panel" id="chatPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-mark">⬤</div>
      <h2>BlackSocial</h2>
      <p>Выберите чат или создайте новый</p>
    </div>
    <div class="chat-view hidden" id="chatView">
      <header class="chat-header">
        <button class="back-btn" id="backBtn" title="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatHeaderName"></div>
          <div class="chat-header-sub" id="chatHeaderSub"></div>
        </div>
      </header>
      <div class="messages" id="messages"></div>
      <div class="composer" id="composer">
        <button class="btn-attach" id="attachBtn" title="Фото">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" class="hidden" multiple>
        <div class="composer-main">
          <div id="previewBar" class="preview-bar hidden"></div>
          <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off">
        </div>
        <button id="sendBtn" class="btn-send" title="Отправить">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="composer-locked hidden" id="composerLocked">
        Только администраторы могут писать в этот канал
      </div>
    </div>
  </main>
</div>

<!-- SIDE DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-profile">
    <div class="drawer-avatar" id="drawerAvatar"></div>
    <div class="drawer-name" id="drawerName">—</div>
    <div class="drawer-username" id="drawerUsername">@—</div>
  </div>
  <nav class="drawer-nav">
    <button class="drawer-item" id="menuProfile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Мой профиль
    </button>
    <button class="drawer-item" id="menuNewChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Новый чат
    </button>
    <button class="drawer-item" id="menuNewGroup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Создать группу
    </button>
    <button class="drawer-item" id="menuNewChannel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      Создать канал
    </button>
    <div class="drawer-sep"></div>
    <button class="drawer-item" id="menuSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      Настройки
    </button>
    <div class="drawer-sep"></div>
    <button class="drawer-item danger" id="menuLogout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Выйти
    </button>
  </nav>
  <div class="drawer-footer">BlackSocial</div>
</aside>

<!-- NEW CHAT MODAL -->
<div id="newChatModal" class="modal hidden">
  <div class="modal-box">
    <header class="modal-header">
      <span>Новый чат</span>
      <button class="modal-close" id="closeModal">✕</button>
    </header>
    <div class="modal-tabs">
      <button class="modal-tab active" data-mtab="private">Личный</button>
      <button class="modal-tab" data-mtab="group">Группа</button>
      <button class="modal-tab" data-mtab="channel">Канал</button>
    </div>
    <div class="modal-pane" id="pane-private">
      <div class="field">
        <input type="text" id="userSearch" placeholder=" " autocomplete="off">
        <label>Юзернейм</label>
      </div>
      <div id="userSearchResults" class="search-results"></div>
    </div>
    <div class="modal-pane hidden" id="pane-group">
      <div class="field">
        <input type="text" id="groupName" placeholder=" " autocomplete="off">
        <label>Название группы</label>
      </div>
      <div class="field">
        <input type="text" id="groupUserSearch" placeholder=" " autocomplete="off">
        <label>Добавить участника</label>
      </div>
      <div id="groupSearchResults" class="search-results"></div>
      <div id="groupSelected" class="selected-chips"></div>
      <button class="btn-primary" id="createGroupBtn">Создать группу</button>
    </div>
    <div class="modal-pane hidden" id="pane-channel">
      <div class="field">
        <input type="text" id="channelName" placeholder=" " autocomplete="off">
        <label>Название канала</label>
      </div>
      <div class="field">
        <textarea id="channelDesc" placeholder=" " rows="3"></textarea>
        <label>Описание (необязательно)</label>
      </div>
      <button class="btn-primary" id="createChannelBtn">Создать канал</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script type="module" src="app.js"></script>
</body>
</html>
