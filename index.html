<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BlackSocial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬤</text></svg>">
  <style>
:root {
  --bg: #0b141a;
  --panel: #111b21;
  --panel-2: #1a242d;
  --border: #222d34;
  --text: #e9edef;
  --text-2: #8696a0;
  --accent: #00a884;
  --accent-hover: #06cf9c;
  --bubble-own: #005c4b;
  --bubble-other: #202c33;
  --danger: #ea4335;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

/* ===== AUTH ===== */
.auth-screen {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(0,168,132,0.12), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(0,100,80,0.08), transparent 50%),
    var(--bg);
}

.auth-box {
  width: 100%;
  max-width: 380px;
  margin: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: var(--shadow);
}

.auth-logo { text-align: center; margin-bottom: 28px; }
.logo-mark { font-size: 36px; color: var(--accent); line-height: 1; margin-bottom: 8px; }
.logo-text { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
.logo-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }

.auth-tabs {
  display: flex;
  background: var(--bg);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 22px;
}
.auth-tab {
  flex: 1; padding: 10px; border: none; background: transparent;
  color: var(--text-2); font-weight: 600; font-size: 14px;
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
}
.auth-tab.active { background: var(--accent); color: #fff; }

.auth-form { display: flex; flex-direction: column; gap: 14px; }

.field { position: relative; }
.field input,
.field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 16px 14px 8px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.field textarea { resize: none; min-height: 72px; padding-top: 20px; }
.field label {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-2); font-size: 14px; pointer-events: none; transition: all 0.15s;
}
.field textarea + label { top: 18px; transform: none; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field input:focus + label,
.field input:not(:placeholder-shown) + label,
.field textarea:focus + label,
.field textarea:not(:placeholder-shown) + label {
  top: 6px; transform: none; font-size: 11px; color: var(--accent);
}

.btn-primary {
  background: var(--accent); color: #fff; border: none; padding: 14px;
  border-radius: var(--radius-sm); font-weight: 600; font-size: 15px;
  cursor: pointer; transition: background 0.15s; margin-top: 4px;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.auth-error { color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; }

/* ===== APP ===== */
.app { display: flex; height: 100%; }

.rail {
  width: 60px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 6px; flex-shrink: 0;
}
.rail-btn {
  width: 42px; height: 42px; border-radius: 12px; border: none;
  background: transparent; color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.rail-btn svg { width: 22px; height: 22px; }
.rail-btn:hover { background: var(--panel-2); color: var(--text); }
.rail-btn.active { background: rgba(0,168,132,0.15); color: var(--accent); }
.rail-spacer { flex: 1; }
.rail-avatar {
  width: 38px; height: 38px; border-radius: 50%; border: none; color: #fff;
  font-weight: 700; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
}
.rail-avatar:hover { transform: scale(1.06); }

.list-panel {
  width: 360px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.list-header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-2); pointer-events: none;
}
.search-wrap input {
  width: 100%; background: var(--bg); border: none; color: var(--text);
  padding: 11px 14px 11px 38px; border-radius: 20px; font-size: 14px; outline: none;
}
.search-wrap input:focus { box-shadow: 0 0 0 1px var(--accent); }

.chat-list { flex: 1; overflow-y: auto; }

.chat-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  cursor: pointer; transition: background 0.12s;
}
.chat-item:hover { background: var(--panel-2); }
.chat-item.active { background: rgba(0,168,132,0.12); }

.chat-avatar {
  width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 17px;
}
.chat-meta { flex: 1; min-width: 0; }
.chat-top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chat-name {
  font-weight: 600; font-size: 15px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.chat-time { font-size: 12px; color: var(--text-2); flex-shrink: 0; }
.chat-bottom-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 3px; gap: 8px;
}
.chat-preview {
  font-size: 13.5px; color: var(--text-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.chat-type-icon { font-size: 12px; margin-right: 3px; opacity: 0.7; }

/* ===== CHAT PANEL ===== */
.chat-panel {
  flex: 1; display: flex; flex-direction: column; background: var(--bg);
  position: relative;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(0,168,132,0.04), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(0,100,80,0.03), transparent 40%);
}

.empty-state {
  height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--text-2); gap: 8px; user-select: none;
}
.empty-mark { font-size: 48px; color: var(--accent); opacity: 0.5; margin-bottom: 8px; }
.empty-state h2 { font-size: 22px; font-weight: 600; color: var(--text); }
.empty-state p { font-size: 14px; }

.chat-view { display: flex; flex-direction: column; height: 100%; }

.chat-header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.back-btn {
  display: none; width: 36px; height: 36px; border: none; background: transparent;
  color: var(--text-2); border-radius: 50%; cursor: pointer;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.back-btn svg { width: 22px; height: 22px; }
.back-btn:hover { background: var(--panel-2); color: var(--text); }

.chat-header-avatar {
  width: 42px; height: 42px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; color: #fff;
  font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.chat-header-info { min-width: 0; }
.chat-header-name {
  font-weight: 600; font-size: 16px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.chat-header-sub { font-size: 13px; color: var(--text-2); }

/* ===== MESSAGES ===== */
.messages {
  flex: 1; overflow-y: auto; padding: 16px 20px 12px;
  display: flex; flex-direction: column; gap: 4px;
}

.date-sep {
  align-self: center; background: rgba(17,27,33,0.85); color: var(--text-2);
  font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 8px;
  margin: 10px 0 6px; backdrop-filter: blur(4px);
}

.msg-row {
  display: flex; flex-direction: column; max-width: min(65%, 480px);
  animation: msgIn 0.18s ease;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.msg-row.own { align-self: flex-end; align-items: flex-end; }
.msg-row.other { align-self: flex-start; align-items: flex-start; }

.msg-sender {
  font-size: 12.5px; font-weight: 600; color: var(--accent);
  margin-bottom: 2px; padding: 0 6px;
}

.msg-bubble {
  padding: 8px 12px 6px; border-radius: 12px; font-size: 14.5px;
  line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; position: relative;
}
.msg-row.own .msg-bubble {
  background: var(--bubble-own); color: #e9edef; border-bottom-right-radius: 4px;
}
.msg-row.other .msg-bubble {
  background: var(--bubble-other); color: #e9edef; border-bottom-left-radius: 4px;
}

.msg-bubble.has-image { padding: 4px; overflow: hidden; }
.msg-bubble.has-image .msg-text { padding: 4px 8px 2px; white-space: pre-wrap; }
.msg-img {
  display: block; max-width: 100%; max-height: 320px; border-radius: 10px;
  cursor: pointer; object-fit: cover; background: #0a0a0a;
}
.msg-img + .msg-text { margin-top: 2px; }

.msg-meta {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 4px; margin-top: 2px; padding: 0 2px;
}
.msg-time { font-size: 11px; color: rgba(255,255,255,0.45); }

/* ===== COMPOSER ===== */
.composer {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px 14px; background: var(--panel); flex-shrink: 0;
}

.btn-attach {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: transparent; color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
}
.btn-attach svg { width: 22px; height: 22px; }
.btn-attach:hover { color: var(--accent); background: var(--panel-2); }

.composer-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.preview-bar {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0;
}
.preview-item {
  position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
  background: var(--bg); border: 1px solid var(--border);
}
.preview-item img { width: 100%; height: 100%; object-fit: cover; }
.preview-item .preview-rm {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: #fff;
  font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.preview-item .preview-rm:hover { background: var(--danger); }

.composer input[type="text"] {
  width: 100%; background: var(--bg); border: none; color: var(--text);
  padding: 12px 18px; border-radius: 24px; font-size: 15px; outline: none;
}
.composer input[type="text"]:focus { box-shadow: 0 0 0 1px var(--accent); }

.btn-send {
  width: 46px; height: 46px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
.btn-send svg { width: 20px; height: 20px; margin-left: 2px; }
.btn-send:hover { background: var(--accent-hover); }
.btn-send:active { transform: scale(0.94); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

.composer-locked {
  padding: 16px; text-align: center; background: var(--panel);
  color: var(--text-2); font-size: 13.5px; flex-shrink: 0;
}

/* ===== UPLOAD PROGRESS ===== */
.upload-toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--panel-2); color: var(--text); padding: 10px 18px;
  border-radius: 10px; font-size: 13px; z-index: 150; border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

/* ===== LIGHTBOX ===== */
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 300; display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.15s ease;
}
.lightbox img {
  max-width: 92vw; max-height: 90vh; object-fit: contain; border-radius: 4px;
}
.lightbox-close {
  position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
  border: none; border-radius: 50%; background: rgba(255,255,255,0.1);
  color: #fff; font-size: 18px; cursor: pointer;
}
.lightbox-close:hover { background: rgba(255,255,255,0.2); }

/* ===== MODAL ===== */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; backdrop-filter: blur(4px); animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  background: var(--panel); width: 100%; max-width: 400px; margin: 16px;
  border-radius: 16px; padding: 20px; max-height: 85vh;
  display: flex; flex-direction: column; border: 1px solid var(--border);
  box-shadow: var(--shadow); animation: slideUp 0.2s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; font-weight: 600; font-size: 17px;
}
.modal-close {
  background: none; border: none; color: var(--text-2); font-size: 18px;
  cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--panel-2); color: var(--text); }

.modal-tabs {
  display: flex; background: var(--bg); border-radius: 10px;
  padding: 3px; margin-bottom: 16px;
}
.modal-tab {
  flex: 1; padding: 9px; border: none; background: transparent;
  color: var(--text-2); font-size: 13px; font-weight: 600;
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
}
.modal-tab.active { background: var(--accent); color: #fff; }

.modal-pane { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

.search-results {
  display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto;
}
.search-result-item {
  display: flex; align-items: center; gap: 12px; padding: 10px;
  border-radius: 10px; cursor: pointer; transition: background 0.12s;
}
.search-result-item:hover { background: var(--panel-2); }
.sr-avatar {
  width: 40px; height: 40px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; color: #fff;
  font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.sr-name { font-size: 14px; font-weight: 600; }
.sr-username { font-size: 12.5px; color: var(--text-2); }

.selected-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: rgba(0,168,132,0.2); color: var(--accent); padding: 5px 10px;
  border-radius: 16px; font-size: 13px; display: flex; align-items: center;
  gap: 6px; font-weight: 500;
}
.chip button {
  background: none; border: none; color: var(--accent); cursor: pointer;
  font-size: 13px; opacity: 0.7; line-height: 1;
}
.chip button:hover { opacity: 1; }

/* scrollbars */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a4a55; }

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .rail { width: 52px; }
  .list-panel {
    width: 100%; position: absolute; inset: 0 0 0 52px; z-index: 10;
  }
  .chat-panel { position: absolute; inset: 0 0 0 52px; z-index: 5; }
  .app.chat-open .list-panel { display: none; }
  .app.chat-open .chat-panel { left: 52px; }
  .back-btn { display: flex; }
  .msg-row { max-width: 85%; }
  .auth-box { margin: 12px; padding: 28px 22px; }
}

@media (max-width: 480px) {
  .rail { display: none; }
  .list-panel { left: 0; }
  .chat-panel { left: 0; }
  .app.chat-open .chat-panel { left: 0; }
}

  </style>
</head>
<body>

<!-- ===== AUTH ===== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-mark">⬤</div>
      <div class="logo-text">BlackSocial</div>
      <div class="logo-sub">мессенджер нового поколения</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <form id="loginForm" class="auth-form">
      <div class="field">
        <input type="email" id="loginEmail" placeholder=" " required autocomplete="email">
        <label>Email</label>
      </div>
      <div class="field">
        <input type="password" id="loginPassword" placeholder=" " required autocomplete="current-password">
        <label>Пароль</label>
      </div>
      <button type="submit" class="btn-primary">Войти</button>
      <div class="auth-error" id="loginError"></div>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <div class="field">
        <input type="text" id="regName" placeholder=" " required autocomplete="name">
        <label>Имя</label>
      </div>
      <div class="field">
        <input type="text" id="regUsername" placeholder=" " required autocomplete="username">
        <label>Юзернейм (латиница)</label>
      </div>
      <div class="field">
        <input type="email" id="regEmail" placeholder=" " required autocomplete="email">
        <label>Email</label>
      </div>
      <div class="field">
        <input type="password" id="regPassword" placeholder=" " required minlength="6" autocomplete="new-password">
        <label>Пароль (мин. 6)</label>
      </div>
      <button type="submit" class="btn-primary">Создать аккаунт</button>
      <div class="auth-error" id="registerError"></div>
    </form>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" class="app hidden">

  <aside class="rail">
    <button class="rail-btn active" data-view="chats" title="Чаты">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="rail-btn" data-view="new" title="Новый чат">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-avatar" id="myAvatar" title="Выйти"></button>
  </aside>

  <section class="list-panel" id="listPanel">
    <header class="list-header">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск" autocomplete="off">
      </div>
    </header>
    <div id="chatList" class="chat-list"></div>
  </section>

  <main class="chat-panel" id="chatPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-mark">⬤</div>
      <h2>BlackSocial</h2>
      <p>Выберите чат или создайте новый</p>
    </div>

    <div class="chat-view hidden" id="chatView">
      <header class="chat-header">
        <button class="back-btn" id="backBtn" title="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatHeaderName"></div>
          <div class="chat-header-sub" id="chatHeaderSub"></div>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="composer" id="composer">
        <button class="btn-attach" id="attachBtn" title="Фото">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" class="hidden" multiple>
        <div class="composer-main">
          <div id="previewBar" class="preview-bar hidden"></div>
          <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off">
        </div>

<script>

const firebaseConfig = {

/* ---------- helpers ---------- */
function hashColor(str) {
  let hash = 0;
  for (let i = 0; i < (str || '').length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 42%)`;
}

function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'вчера';
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}

function fmtDateSep(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Сегодня';
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU', {
    day: 'numeric',
    month: 'long',
    year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
  });
}

function sameDay(a, b) {
  if (!a || !b) return false;
  const da = a.toDate ? a.toDate() : new Date(a);
  const db = b.toDate ? b.toDate() : new Date(b);
  return da.toDateString() === db.toDateString();
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function showToast(text, ms = 2500) {
  const existing = document.querySelector('.upload-toast');
  if (existing) existing.remove();
  const t = el(`<div class="upload-toast">${escapeHtml(text)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ---------- AUTH UI ---------- */
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('loginForm').classList.toggle('hidden', target !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', target !== 'register');
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    errBox.textContent = translateAuthError(err);
  }
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const username = document.getElementById('regUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const errBox = document.getElementById('registerError');
  errBox.textContent = '';

  if (!username) {
    errBox.textContent = 'Юзернейм: только латиница, цифры и _';
    return;
  }
  if (username.length < 3) {
    errBox.textContent = 'Юзернейм слишком короткий (мин. 3)';
    return;
  }

  try {
    const existing = await db.collection('users').where('username', '==', username).get();
    if (!existing.empty) {
      errBox.textContent = 'Этот юзернейм уже занят';
      return;
    }

    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid,
      name,
      username,
      email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (err) {
    errBox.textContent = translateAuthError(err);
  }
});

function translateAuthError(err) {
  const map = {
    'auth/email-already-in-use': 'Этот email уже зарегистрирован',
    'auth/invalid-email': 'Некорректный email',
    'auth/weak-password': 'Пароль слишком слабый (мин. 6 символов)',
    'auth/user-not-found': 'Пользователь не найден',
    'auth/wrong-password': 'Неверный пароль',
    'auth/invalid-credential': 'Неверный email или пароль',
    'auth/invalid-login-credentials': 'Неверный email или пароль',
    'auth/too-many-requests': 'Слишком много попыток. Подождите',
    'auth/network-request-failed': 'Нет сети или домен не разрешён в Firebase',
    'auth/operation-not-allowed': 'В Firebase не включён вход по Email/Password'
  };
  return map[err.code] || err.message || String(err);
}

/* ---------- AUTH STATE ---------- */
auth.onAuthStateChanged(async (user) => {

    currentUser = user;
    const doc = await db.collection('users').doc(user.uid).get();

    if (!currentProfile) {
      await auth.signOut();
      return;
    }

    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    const av = document.getElementById('myAvatar');
    av.textContent = initials(currentProfile.name);
    av.style.background = hashColor(currentProfile.name);
    av.title = currentProfile.name + ' (@' + currentProfile.username + ') — нажмите, чтобы выйти';

    subscribeChats();
  } else {
    currentUser = null;
    currentProfile = null;
    currentChatId = null;
    currentChat = null;
    pendingFiles = [];
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('app').classList.remove('chat-open');
    if (unsubChats) unsubChats();
    if (unsubMessages) unsubMessages();
  }
});

document.getElementById('myAvatar').addEventListener('click', () => {

    auth.signOut();
  }
});

/* ---------- CHAT LIST ---------- */
function subscribeChats() {
  if (unsubChats) unsubChats();
  unsubChats = db.collection('chats')
    .where('members', 'array-contains', currentUser.uid)
    .onSnapshot(snap => {
      allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allChats.sort((a, b) => {
        const ta = a.lastMessageTime ? a.lastMessageTime.toMillis() : 0;
        const tb = b.lastMessageTime ? b.lastMessageTime.toMillis() : 0;
        return tb - ta;
      });
      renderChatList();
    }, err => console.error('chats listener error', err));
}

function renderChatList() {
  const listEl = document.getElementById('chatList');
  const filter = document.getElementById('searchInput').value.trim().toLowerCase();
  listEl.innerHTML = '';

  const filtered = allChats.filter(c => chatDisplayName(c).toLowerCase().includes(filter));

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-2);font-size:14px;">Нет чатов</div>';
    return;
  }

  filtered.forEach(c => {
    const name = chatDisplayName(c);
    let icon = '';
    if (c.type === 'group') icon = '👥 ';
    else if (c.type === 'channel') icon = '📢 ';

    let preview = c.lastMessage || 'Нет сообщений';
    if (preview === '📷 Фото') preview = '📷 Фото';

    const item = el(`
      <div class="chat-item" data-id="${c.id}">
        <div class="chat-avatar" style="background:${hashColor(name)}">${initials(name)}</div>
        <div class="chat-meta">
          <div class="chat-top-row">
            <div class="chat-name">${escapeHtml(name)}</div>
            <div class="chat-time">${fmtTime(c.lastMessageTime)}</div>
          </div>
          <div class="chat-bottom-row">
            <div class="chat-preview"><span class="chat-type-icon">${icon}</span>${escapeHtml(preview)}</div>
          </div>
        </div>
      </div>`);
    item.addEventListener('click', () => openChat(c.id));
    if (c.id === currentChatId) item.classList.add('active');
    listEl.appendChild(item);
  });
}

document.getElementById('searchInput').addEventListener('input', renderChatList);

function chatDisplayName(chat) {
  if (chat.type === 'private') {
    const otherUid = chat.members.find(m => m !== currentUser.uid);
    return (chat.memberNames && chat.memberNames[otherUid]) || 'Пользователь';
  }
  return chat.name || 'Без названия';
}

/* ---------- OPEN CHAT ---------- */
function openChat(chatId) {
  currentChatId = chatId;
  currentChat = allChats.find(c => c.id === chatId);
  if (!currentChat) return;

  pendingFiles = [];
  renderPreviewBar();

  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('app').classList.add('chat-open');
  renderChatList();

  const name = chatDisplayName(currentChat);
  const hAv = document.getElementById('chatHeaderAvatar');
  hAv.textContent = initials(name);
  hAv.style.background = hashColor(name);
  document.getElementById('chatHeaderName').textContent = name;

  let sub = '';
  if (currentChat.type === 'group') {
    sub = `Группа · ${currentChat.members.length} участн.`;
  } else if (currentChat.type === 'channel') {
    sub = `Канал · ${currentChat.members.length} подписчиков`;
  } else {
    sub = 'личный чат';
  }
  document.getElementById('chatHeaderSub').textContent = sub;

  const isChannel = currentChat.type === 'channel';
  const isAdmin = !isChannel || (currentChat.admins || []).includes(currentUser.uid);
  document.getElementById('composer').classList.toggle('hidden', !isAdmin);
  document.getElementById('composerLocked').classList.toggle('hidden', isAdmin);

  if (unsubMessages) unsubMessages();
  const msgsEl = document.getElementById('messages');
  msgsEl.innerHTML = '';

  unsubMessages = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      msgsEl.innerHTML = '';
      let lastTs = null;

      snap.forEach(doc => {
        const m = doc.data();
        if (!sameDay(lastTs, m.timestamp)) {
          const sep = el(`<div class="date-sep">${fmtDateSep(m.timestamp)}</div>`);
          msgsEl.appendChild(sep);
        }
        lastTs = m.timestamp;

        const own = m.senderId === currentUser.uid;
        const showSender = !own && currentChat.type !== 'private';
        const hasImage = !!m.imageUrl;
        const hasText = !!(m.text && m.text.trim());

        let bubbleInner = '';
        if (hasImage) {
          bubbleInner += `<img class="msg-img" src="${escapeHtml(m.imageUrl)}" alt="фото" loading="lazy">`;
        }
        if (hasText) {
          bubbleInner += `<div class="msg-text">${escapeHtml(m.text)}</div>`;
        }
        if (!hasImage && !hasText) {
          bubbleInner = '<div class="msg-text">(пусто)</div>';
        }

        const row = el(`
          <div class="msg-row ${own ? 'own' : 'other'}">
            ${showSender ? `<div class="msg-sender">${escapeHtml(m.senderName)}</div>` : ''}
            <div class="msg-bubble ${hasImage ? 'has-image' : ''}">${bubbleInner}</div>
            <div class="msg-meta"><span class="msg-time">${fmtTime(m.timestamp)}</span></div>
          </div>`);

        if (hasImage) {
          const img = row.querySelector('.msg-img');
          img.addEventListener('click', () => openLightbox(m.imageUrl));
        }

        msgsEl.appendChild(row);
      });

      msgsEl.scrollTop = msgsEl.scrollHeight;
    }, err => console.error('messages listener error', err));
}

/* ---------- IMAGE ATTACH ---------- */
document.getElementById('attachBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';

  for (const f of files) {
    if (!f.type.startsWith('image/')) {
      showToast('Можно только изображения');
      continue;
    }
    if (f.size > MAX_IMAGE_SIZE) {
      showToast('Файл больше 8 МБ');
      continue;
    }
    if (pendingFiles.length >= MAX_IMAGES) {
      showToast('Максимум 5 фото за раз');
      break;
    }
    pendingFiles.push(f);
  }
  renderPreviewBar();
});

function renderPreviewBar() {
  const bar = document.getElementById('previewBar');
  bar.innerHTML = '';
  if (pendingFiles.length === 0) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');

  pendingFiles.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    const item = el(`
      <div class="preview-item">
        <img src="${url}" alt="">
        <button type="button" class="preview-rm" data-idx="${idx}">✕</button>
      </div>`);
    item.querySelector('.preview-rm').addEventListener('click', () => {
      pendingFiles.splice(idx, 1);
      renderPreviewBar();
    });
    bar.appendChild(item);
  });
}

/* ---------- UPLOAD + SEND ---------- */
async function uploadImage(file, chatId) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `chats/${chatId}/${currentUser.uid}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const ref = storage.ref(path);
  const snap = await ref.put(file, { contentType: file.type });
  return await snap.ref.getDownloadURL();
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  const files = [...pendingFiles];

  if ((!text && files.length === 0) || !currentChatId) return;

  input.value = '';
  pendingFiles = [];
  renderPreviewBar();
  input.focus();

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  try {
    const chatRef = db.collection('chats').doc(currentChatId);

    if (files.length > 0) {
      showToast(files.length === 1 ? 'Загрузка фото…' : `Загрузка ${files.length} фото…`);
    }

    // Send each image as its own message (Telegram-style)
    for (let i = 0; i < files.length; i++) {
      const imageUrl = await uploadImage(files[i], currentChatId);
      const isLast = i === files.length - 1;
      const msgText = isLast && text ? text : '';

      await chatRef.collection('messages').add({
        senderId: currentUser.uid,
        senderName: currentProfile.name,
        text: msgText,
        imageUrl,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // Text-only message
    if (files.length === 0 && text) {
      await chatRef.collection('messages').add({
        senderId: currentUser.uid,
        senderName: currentProfile.name,
        text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // Update chat preview
    let lastPreview = text;
    if (files.length > 0) {
      lastPreview = text ? `📷 ${text}` : '📷 Фото';
    }
    if (lastPreview.length > 80) lastPreview = lastPreview.slice(0, 80) + '…';

    await chatRef.update({
      lastMessage: lastPreview || '📷 Фото',
      lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
    });

  } catch (err) {
    console.error('send error', err);
    showToast('Ошибка отправки: ' + (err.message || 'неизвестно'), 4000);
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('userSearch').addEventListener('input', (e) => {

async function searchUsers(term, resultsElId, onPick) {
  const resultsEl = document.getElementById(resultsElId);
  resultsEl.innerHTML = '';
  if (!term || term.length < 1) return;

  try {
    const snap = await db.collection('users')
      .where('username', '>=', term)
      .where('username', '<=', term + '\uf8ff')
      .limit(12)
      .get();

    if (snap.empty) {
      resultsEl.innerHTML = '<div style="padding:12px;color:var(--text-2);font-size:13px;text-align:center;">Никого не найдено</div>';
      return;
    }

    snap.forEach(doc => {
      const u = doc.data();
      if (u.uid === currentUser.uid) return;
      const item = el(`
        <div class="search-result-item">
          <div class="sr-avatar" style="background:${hashColor(u.name)}">${initials(u.name)}</div>
          <div>
            <div class="sr-name">${escapeHtml(u.name)}</div>
            <div class="sr-username">@${escapeHtml(u.username)}</div>
          </div>
        </div>`);
      item.addEventListener('click', () => onPick(u));
      resultsEl.appendChild(item);
    });
  } catch (err) {
    console.error('search error', err);
    resultsEl.innerHTML = '<div style="padding:12px;color:var(--danger);font-size:13px;">Ошибка поиска</div>';
  }
}

async function startPrivateChat(otherUser) {
  const uid1 = currentUser.uid;
  const uid2 = otherUser.uid;
  const chatId = [uid1, uid2].sort().join('_');
  const chatRef = db.collection('chats').doc(chatId);
  const doc = await chatRef.get();

  if (!doc.exists) {
    await chatRef.set({
      type: 'private',
      members: [uid1, uid2],
      memberNames: {
        [uid1]: currentProfile.name,
        [uid2]: otherUser.name
      },
      lastMessage: '',
      lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  openChat(chatId);
}

/* --- group --- */
let groupSelectedUsers = {};

document.getElementById('groupUserSearch').addEventListener('input', (e) => {
  clearTimeout(userSearchTimeout);
  const val = e.target.value.trim().toLowerCase();
  userSearchTimeout = setTimeout(() => searchUsers(val, 'groupSearchResults', (user) => {
    groupSelectedUsers[user.uid] = user;
    renderGroupChips();
    document.getElementById('groupUserSearch').value = '';
    document.getElementById('groupSearchResults').innerHTML = '';
  }), 280);
});

function renderGroupChips() {
  const chipsEl = document.getElementById('groupSelected');
  chipsEl.innerHTML = '';
  Object.values(groupSelectedUsers).forEach(u => {
    const chip = el(`<div class="chip">${escapeHtml(u.name)} <button type="button">✕</button></div>`);
    chip.querySelector('button').addEventListener('click', () => {
      delete groupSelectedUsers[u.uid];
      renderGroupChips();
    });
    chipsEl.appendChild(chip);
  });
}

document.getElementById('createGroupBtn').addEventListener('click', async () => {
  const name = document.getElementById('groupName').value.trim();
  if (!name) { alert('Введите название группы'); return; }
  const memberIds = [currentUser.uid, ...Object.keys(groupSelectedUsers)];
  if (memberIds.length < 2) { alert('Добавьте хотя бы одного участника'); return; }

  try {
    const ref = await db.collection('chats').add({
      type: 'group',
      name,
      members: memberIds,
      admins: [currentUser.uid],
      lastMessage: `${currentProfile.name} создал(а) группу`,
      lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('groupName').value = '';
    groupSelectedUsers = {};
    renderGroupChips();
    modal.classList.add('hidden');
    openChat(ref.id);
  } catch (err) {
    console.error(err);
    alert('Ошибка создания группы');
  }
});

/* --- channel --- */
document.getElementById('createChannelBtn').addEventListener('click', async () => {
  const name = document.getElementById('channelName').value.trim();
  const desc = document.getElementById('channelDesc').value.trim();
  if (!name) { alert('Введите название канала'); return; }

  try {
    const ref = await db.collection('chats').add({
      type: 'channel',
      name,
      description: desc,
      members: [currentUser.uid],
      admins: [currentUser.uid],
      lastMessage: `Канал «${name}» создан`,
      lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('channelName').value = '';
    document.getElementById('channelDesc').value = '';
    modal.classList.add('hidden');
    openChat(ref.id);
  } catch (err) {
    console.error(err);
    alert('Ошибка создания канала');
  }
});

</script>
